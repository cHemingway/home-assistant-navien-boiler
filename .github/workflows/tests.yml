name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.14"
          activate-environment: true
      - name: Install
        run: uv pip install -r requirements_test.txt
      - name: Lint
        run: ruff check .
      - name: Translations up to date
        run: python scripts/gen_translations.py --check
      - name: Test
        run: pytest -q
