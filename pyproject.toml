[project]
name = "home-assistant-navien-smartplus"
version = "0.1.0"
description = "Home Assistant integration for Navien Smart Plus (UK) boilers"
requires-python = ">=3.14"

[tool.ruff]
target-version = "py314"

[tool.ruff.lint]
select = ["B", "D", "E", "F", "I", "RUF", "SIM", "UP", "W"]
ignore = ["E501", "RUF012"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# Development scripts, not part of the integration.
"scripts/*" = ["D"]

[tool.ruff.lint.isort]
force-sort-within-sections = true
known-first-party = ["custom_components", "api"]
combine-as-imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
